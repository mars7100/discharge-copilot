    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="1.69" y1="-1.43" x2="34.31" y2="37.43">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="11" fill="url(#g)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">
    <text x="18" y="18" dy="0.35em" text-anchor="middle" fill="#fff">↔</text>
    <text x="45" y="18" dy="0.35em" fill="#19191d" letter-spacing="-0.8">discharge<tspan dx="2" font-weight="400">copilot</tspan></text>
