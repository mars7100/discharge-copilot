[project]
name = "discharge-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.14",
    "openai>=3.27.0",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
